# Paper (watch-only) copy-trading bot config. NO real trades are ever made in paper mode.
mode: paper                 # only "paper" is supported
live_trading: false         # execution stub refuses unless this is true AND file LIVE_CONFIRM exists. Keep false.

paper:
  start_equity_usd: 52
  size_multiplier: 0.25       # copy 0.25x of the trader's USD size...
  max_position_pct: 0.10      # ...capped at 10% of current equity (a 15% stop then costs 1.5% of the book)
  min_order_usd: 1.0
  fee_pct: 0.02               # per side (2% = copyfomo-like; set 0.005 for FOMO-like)
  slippage_pct: 0.0           # extra haircut on top of the real Jupiter quote (0 = trust the quote)
  exec_latency_s: 1.5         # simulated sign+send+land time; we re-quote after it and fill at that quote
  quote_slippage_bps: 300     # slippage tolerance sent to Jupiter quote
  gas_usd: 0.01               # per side
  max_open_positions: 6

safeguards:
  daily_loss_limit_pct: 0.15  # pause new buys for the rest of the UTC day if equity down 15% vs day start
  max_drawdown_pct: 0.40      # auto-shutdown (stop new buys permanently) if equity < 60% of peak
  min_liquidity_usd: 50000    # skip tokens with less liquidity (Jupiter price API)
  max_price_impact_pct: 0.03  # skip if Jupiter quote price impact for our size exceeds 3%
  stop_file: STOP             # create bot/STOP to stop the bot immediately

exits:                        # our own exits on top of copying the trader's sells (paper only)
  enabled: true
  stop_loss_pct: 0.15         # sell all if the position is down 15% vs what we paid (buy fee included)
  take_profit_pct: 0.30       # sell all if it is up 30%
  max_hold_hours: 24          # sell all after 24h even if the trader still holds (0 = off)
  check_seconds: 30           # how often open positions are priced
  sell_retry_give_up_hours: 24  # failed sells retry with backoff; after this long the position is written off at $0

books:                        # each strategy is a "book" with its own paper money and limits; unset values come from paper:/safeguards:
  copy: {enabled: true}       # copies the selected traders
  consensus: {enabled: true, start_equity_usd: 25, max_open_positions: 3, max_position_pct: 0.10, window_minutes: 15, min_traders: 2}
  trend:                      # Trend Rider v1 on SOL/USDC (rules in strategy_trend.py); same limits as its future live book
    enabled: true
    start_equity_usd: 30
    max_open_positions: 1
    max_position_pct: 0.50    # position cap; size itself comes from risking 0.5% of the book at the stop
    fee_pct: 0.001            # safety margin per side on top of the real Jupiter quote
    quote_slippage_bps: 50
    exec_latency_s: 1.5
    max_price_impact_pct: 0.005
    min_liquidity_usd: 1000000
    daily_loss_limit_pct: 0.02
    weekly_loss_limit_pct: 0.04
    max_drawdown_pct: 0.06
    exits: {enabled: false}   # Trend Rider manages its own exits (stop, 2R target, break-even, trend break, 48h)
    backtest_days: 730
    backtest_cost: 0.0015     # cost per side assumed in the backtest (0.1% margin + ~0.05% pool fee/impact)

live:                         # real-money Trend Rider (book trend-live). OFF until /live arm; see live.py for every condition
  approvals_required: 10      # the first 10 live buys need your Approve tap
  slippage_bps: 100
  priority_max_lamports: 100000
  sol_reserve: 0.02           # SOL kept in the wallet for network fees
  min_usdc_to_arm: 5
  min_paper_days: 7           # Trend Rider must have run on paper this long
  daily_loss_limit_pct: 0.02
  weekly_loss_limit_pct: 0.04
  max_drawdown_pct: 0.06      # trips -> disarmed, back to paper until you review
  approval_seconds: 120

gate:                         # the risk gate every buy must pass (first failure wins; sells are never blocked)
  max_signal_age_s: 120       # skip a copy if we saw the trader's trade more than 2 min late
  veto_enabled: true          # refuse coins with mint/freeze authority, Token-2022 fees/hooks, concentrated holders
  max_top10_share: 0.30       # top 10 real holders (pools and programs excluded) may own at most 30%
  max_roundtrip_loss_pct: 0.06  # buy then instant sell may lose at most 6% (catches honeypots and thin markets)
  max_coin_exposure_pct: 0.15 # at most 15% of all books' money in any one coin
  storm_drop_pct: 0.05        # SOL down 5% within an hour ...
  storm_pause_minutes: 60     # ... pauses new buys in every book for an hour

selection:
  top_n: 3
  lookback_days: 30
  min_trades: 10
  min_profit_factor: 1.2
  min_win_rate: 0.30
  max_dd_frac_of_gross_wins: 0.5
  max_top3_share: 0.70        # top-3 wins may not exceed 70% of gross wins
  min_solana_share: 0.5       # share of leaderboard topTokens on Solana (proxy)
  min_trip_cost_usd: 5
  leaderboards: [24h, 7d, 30d, all]   # 250 fomoapi credits each per daily refresh
  leaderboard_limit: 150
  max_candidates: 300          # total after dedupe (FOMO first)
  max_helius_credits_per_run: 20000   # hard cap per daily selection (~600k/month worst case; free plan = 1M)
  max_history_pages_external: 8       # history pages for non-FOMO candidates
  max_trades_per_day: 20              # reject bot-like wallets (closed round trips/day over the lookback)
  max_history_pages: 15       # Helius pages (100 tx) per wallet per refresh
  reevaluate_hours: 24

monitor:
  commitment: confirmed
  poll_seconds: 25            # fallback polling interval while the websocket is DOWN
  fallback_poll_seconds: 120  # safety-net polling while the websocket is UP (dedupe by signature)

sources:                      # candidate sources (all judged by the same on-chain filters)
  fomo: {enabled: true}                         # fomoapi.io leaderboards (FOMOAPI_KEY)
  dexscreener_buyers: {enabled: true, max_tokens: 20, max_wallets: 60}   # no key: trending tokens -> recent buyers via Helius
  birdeye: {enabled: true, windows: [1W, 30d], limit: 50}               # needs free BIRDEYE_API_KEY (skipped if absent)
  nansen: {enabled: false}                      # needs NANSEN_API_KEY; free plan only 10 credits/day

telegram:
  enabled: true               # no-ops automatically if TELEGRAM_BOT_TOKEN is not set
