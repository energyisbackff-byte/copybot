# docker compose -f deploy/docker-compose.yml up -d   (from the repo folder; .env next to it holds the API keys)
services:
  bot:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    volumes: [zetrax-data:/data]
    restart: always
  dashboard:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["python","dashboard/server.py"]
    environment: {COPYBOT_DB: /data/bot.db, COPYBOT_HEARTBEAT: /data/heartbeat, DASH_HOST: 0.0.0.0}
    volumes: [zetrax-data:/data, ../dashboard/token.txt:/opt/copybot/dashboard/token.txt:ro]
    ports: ["127.0.0.1:8787:8787"]
    restart: always
volumes:
  zetrax-data: {}
